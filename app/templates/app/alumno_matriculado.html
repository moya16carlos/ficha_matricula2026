<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Exitoso · Liceo Municipal San Pedro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Contraste: paleta slate un paso más oscura (textos secundarios legibles)
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              200: '#e2e8f0', 300: '#94a3b8', 400: '#64748b', 500: '#475569',
              600: '#334155', 700: '#1e293b', 800: '#0f172a', 900: '#020617'
            }
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html,body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-200 text-slate-900 flex items-center justify-center min-h-screen p-6">
  <main class="w-full max-w-md rounded-3xl bg-white ring-1 ring-slate-200 shadow-xl p-10 text-center">
    <div class="mx-auto h-16 w-16 rounded-2xl bg-emerald-50 ring-1 ring-emerald-200 flex items-center justify-center">
      <svg class="h-8 w-8 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1 class="mt-6 text-xl font-bold text-slate-900">¡Matrícula registrada con éxito!</h1>
    <p class="mt-2 text-sm text-slate-500 leading-relaxed">
      Los datos del estudiante quedaron guardados. Puedes contactar a la educación del liceo para cualquier consulta.
    </p>
  </main>
</body>
</html>
